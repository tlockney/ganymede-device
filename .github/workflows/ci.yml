name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The preload in a real Worker, under cdp-kernel's browser target, in
  # headless Chromium. cdp-kernel is pinned to the release this package
  # targets (preload and host options, tlockney/cdp-kernel#384); bump it
  # here when the package needs a newer one. The test fails, not skips,
  # when CDPK_DIR is set but unusable.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tlockney/cdp-kernel
          ref: v0.7.2
          path: cdp-kernel
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: cdp-kernel
      - run: npm install --no-save --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node --test test/browser.test.ts
        env:
          CDPK_DIR: ${{ github.workspace }}/cdp-kernel

  # The Swift DeviceBridge: unit tests on macOS, and a build for iOS.
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      # SwiftPM names the scheme after the package.
      - run: xcodebuild -list
      - run: xcodebuild build -scheme GanymedeDevice -destination 'generic/platform=iOS' -quiet
