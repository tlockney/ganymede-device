name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which jobs a pull request needs (scripts/ci-changes.sh, #45): docs and
  # Markdown need none, Swift alone needs only swift, TypeScript alone
  # only test and browser. A job skipped by its `if` reports success, so
  # the required checks pass. If this job fails, its outputs are empty and
  # every job runs. A push to main is checked the same way (#49).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.changes.outputs.ts }}
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          # A push's base: main before the push (the script fetches it).
          BASE_SHA: ${{ github.event.before }}

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The preload in a real Worker, under cdp-kernel's browser target, in
  # headless Chromium. cdp-kernel is pinned to the release this package
  # targets (preload and host options, tlockney/cdp-kernel#384); bump it
  # here when the package needs a newer one. The test fails, not skips,
  # when CDPK_DIR is set but unusable.
  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ts != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tlockney/cdp-kernel
          ref: v0.9.0
          path: cdp-kernel
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: cdp-kernel
      - run: npm install --no-save --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node --test test/browser.test.ts
        env:
          CDPK_DIR: ${{ github.workspace }}/cdp-kernel

  # The Swift DeviceBridge: unit tests on macOS, and a build for iOS.
  swift:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      # SwiftPM names the scheme after the package.
      - run: xcodebuild -list
      - run: xcodebuild build -scheme GanymedeDevice -destination 'generic/platform=iOS' -quiet
